
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Unity Web Player | ban ruoi</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #unity-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: min(100vw, calc(100vh * 8 / 5));
            aspect-ratio: 8 / 5;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #231F20;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translateX(-50%);
            z-index: 10;
            max-width: 90%;
        }

        #unity-footer {
            display: none;
        }
    </style>
</head>

<body>
    <div id="unity-container">
        <canvas id="unity-canvas"
                width="960"
                height="600"
                tabindex="-1"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>

        <div id="unity-warning"></div>
    </div>

    <script>
        const canvas = document.querySelector("#unity-canvas");
        const container = document.querySelector("#unity-container");

        function unityShowBanner(msg, type) {
            const warningBanner = document.querySelector("#unity-warning");
            const div = document.createElement("div");

            div.textContent = msg;
            div.style.padding = "10px";
            div.style.marginBottom = "5px";

            if (type === "error") {
                div.style.background = "red";
                div.style.color = "white";
            } else {
                div.style.background = "yellow";
                div.style.color = "black";

                setTimeout(() => {
                    div.remove();

                    if (warningBanner.children.length === 0) {
                        warningBanner.style.display = "none";
                    }
                }, 5000);
            }

            warningBanner.appendChild(div);
            warningBanner.style.display = "block";
        }

        const buildUrl = "Build";

        const config = {
            arguments: [],
            dataUrl: buildUrl + "/game_web.data",
            frameworkUrl: buildUrl + "/game_web.framework.js",
            codeUrl: buildUrl + "/game_web.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "ban ruoi",
            productVersion: "1.0",
            showBanner: unityShowBanner
        };

        function resizeGame() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            const gameWidth = Math.min(width, height * 8 / 5);
            const gameHeight = gameWidth * 5 / 8;

            container.style.width = gameWidth + "px";
            container.style.height = gameHeight + "px";
        }

        resizeGame();

        window.addEventListener("resize", resizeGame);
        window.addEventListener("orientationchange", () => {
            setTimeout(resizeGame, 150);
        });

        document.querySelector("#unity-loading-bar").style.display = "block";

        const script = document.createElement("script");
        script.src = buildUrl + "/game_web.loader.js";

        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                document.querySelector("#unity-progress-bar-full")
                    .style.width = (100 * progress) + "%";
            }).then(() => {
                document.querySelector("#unity-loading-bar").style.display = "none";
            }).catch((message) => {
                unityShowBanner(String(message), "error");
            });
        };

        script.onerror = () => {
            unityShowBanner(
                "Không thể tải Unity Loader. Hãy kiểm tra thư mục Build.",
                "error"
            );
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
